
<section class="resume-section education-section">
    <h3 class="resume-section-heading">{{ i18n "education" }}</h3>
    <ul class="resume-detail-list">
        {{ range .Site.Params.education.list }}
        <li class="resume-detail-item">
            <div>{{ .degree }}</div>
            <div class="muted">{{ .university }}</div>
            <div class="muted">{{ .dates }}</div>
        </li>
        {{ end }}
    </ul>
</section>
