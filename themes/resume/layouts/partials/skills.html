
<section class="resume-section skills-section">
    <h3 class="resume-section-heading">{{ i18n "skills" }}</h3>
    {{ range .Site.Params.skills.list }}
    <div class="resume-detail-item">
        <h4 class="resume-item-title">{{ .title }}</h4>
        <ul class="resume-detail-list">
            {{ range .items }}
            <li class="resume-detail-item">{{ with .details }}{{ . | markdownify }}{{ end }}</li>
            {{ end }}
        </ul>
    </div>
    {{ end }}
</section>
