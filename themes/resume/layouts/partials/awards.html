
<section class="resume-section education-section">
    <h3 class="resume-section-heading">{{ i18n "awards" }}</h3>
    <ul class="resume-detail-list">
        {{ range .Site.Params.awards.list }}
        <li class="resume-detail-item">
            <div>{{ .name }}</div>
            <div class="muted">{{ .body }}</div>
            <div class="muted">{{ .date }}</div>
        </li>
        {{ end }}
    </ul>
</section>
