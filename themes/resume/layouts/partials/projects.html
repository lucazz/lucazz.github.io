
<section class="resume-section project-section">
    <h3 class="resume-section-heading">{{ i18n "projects" }}</h3>
    {{ range .Site.Params.projects.list }}
    <div class="resume-item">
        <div class="resume-item-heading">
            <h4 class="resume-item-title">{{ .title }}</h4>
            <div class="resume-item-meta">{{ .meta }}</div>
        </div>
        <div class="resume-item-content">
            <p>{{ .tagline }}</p>
        </div>
    </div>
    {{ end }}
</section>
