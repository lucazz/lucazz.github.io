
<section class="resume-section work-section">
    <h3 class="resume-section-heading">{{ i18n "experiences" }}</h3>
    {{ range .Site.Params.experience.list }}
    <div class="resume-item">
        <div class="resume-item-heading">
            <h4 class="resume-item-title">{{ .title }}</h4>
            <div class="resume-item-meta">{{ .company }} | {{ .dates }}</div>
        </div>
        <div class="resume-item-content">
            <p>{{ with .details }}{{ . | markdownify }}{{ end }}</p>
            <ul class="resume-list">
                {{ range .items }}
                <li>{{ with .details }}{{ . | markdownify }}{{ end }}</li>
                {{ end }}
            </ul>
        </div>
    </div>
    {{ end }}
</section>
